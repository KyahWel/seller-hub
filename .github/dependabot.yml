# Weekly PRs for dependency and GitHub Actions updates, including security fixes.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # NestJS 12 is ESM-only and breaks the Jest setup; migrate by hand (#21).
      - dependency-name: '@nestjs/*'
        update-types: ['version-update:semver-major']
    groups:
      # Nx plugins must stay on the same version; `nx migrate` handles them.
      nx:
        patterns:
          - 'nx'
          - '@nx/*'
      nestjs:
        patterns:
          - '@nestjs/*'
      nuxt:
        patterns:
          - 'nuxt'
          - '@nuxt/*'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
